<!DOCTYPE html>
<html lang="en">
<head>
    <title>Money Exchange Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial; 
            margin: 10px; 
            max-width: 100%; 
            padding: 0; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #333; }
        .balances { 
            background: #e8f4f8; 
            padding: 15px; 
            border-radius: 5px; 
            margin: 10px 0; 
        }
        .form-row { display: flex; gap: 10px; margin: 10px 0; }
        .form-row select, .form-row input { flex: 1; }
        select, input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 5px 0; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            font-size: 16px; 
        }
        textarea { height: 60px; }
        input[type="submit"] { 
            width: 100%; 
            padding: 15px; 
            font-size: 18px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            margin-top: 10px; 
        }
        .links { text-align: center; margin: 20px 0; }
        .links a { margin: 0 10px; font-size: 18px; }
        @media (max-width: 600px) {
            .form-row { flex-direction: column; }
            input, select { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Money Exchange</h1>
        
        <div class="balances">
            <h2>Current Balances</h2>
            {% if balances %}
                <ul style="padding-left: 20px;">
                    {% for currency, amount in balances.items() %}
                        <li style="color: {% if amount >= 0 %}green{% else %}red{% endif %}; margin: 5px 0;">
                            <strong>{{ currency }}</strong>: {{ "%.2f"|format(amount) }}
                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p>No transactions yet!</p>
            {% endif %}
        </div>

        <h2>Add Transaction</h2>
        <form method="POST">
            <div class="form-row">
                <select name="from_currency" required>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="IRR">IRR</option>
                    <option value="CAD">CAD</option>
                </select>
                <input type="number" name="from_amount" step="0.01" placeholder="100" required>
            </div>
            <div class="form-row">
                <select name="to_currency" required>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="IRR">IRR</option>
                    <option value="CAD">CAD</option>
                </select>
                <input type="number" name="exchange_rate" step="0.001" placeholder="0.85" id="rate" required>
		<button type="button" onclick="getLiveRate()" style="padding:10px; background:#2196F3; color:white; border:none; border-radius:4px; margin-left:5px;">🌍 LIVE RATE</button>
            </div>
            <textarea name="notes" placeholder="Customer name or notes..."></textarea>
            <input type="submit" value="💸 ADD TRANSACTION" style="width:100%; padding:15px; font-size:18px; background:#4CAF50; color:white; border:none; border-radius:5px;">
        </form>

        <div class="links">
            <a href="{{ url_for('transactions') }}" style="font-size:18px;">📋 History</a> | 
		<a href="{{ url_for('charts') }}" style="font-size:18px; color: blue;">📊 CHARTS</a> | 
		<a href="{{ url_for('export_csv') }}" style="font-size:18px; color: green;">💾 CSV</a>
        </div>
    </div>

    <script>
    document.querySelector('form').onsubmit = function(e) {
        let fromAmt = parseFloat(document.querySelector('[name="from_amount"]').value);
        let rate = parseFloat(document.querySelector('[name="exchange_rate"]').value);
        let toCurr = document.querySelector('[name="to_currency"]').value;
        let toAmt = fromAmt * rate;
        alert(`You will receive: ${toAmt.toFixed(2)} ${toCurr}`);
    };
    </script>

<script>
function getLiveRate() {
    let fromCurr = document.querySelector('[name="from_currency"]').value;
    let toCurr = document.querySelector('[name="to_currency"]').value;
    if (!fromCurr || !toCurr) {
        alert('Please select FROM and TO currencies first!');
        return;
    }
    fetch(`/get_rate/${fromCurr}/${toCurr}`)
        .then(response => response.text())
        .then(rate => {
            document.querySelector('#rate').value = rate;
            alert(`✅ LIVE RATE: 1 ${fromCurr} = ${rate} ${toCurr}`);
        });
}
</script>
</body>
</html>
