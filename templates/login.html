{% extends "base.html" %}
{% block title %}Login - Piggy Bank{% endblock %}
{% block content %}
<div style="max-width:400px; margin:50px auto; padding:20px; background:#f9f9f9; border-radius:8px;">
    <h2 style="text-align:center; color:#3498db;">🐷 Piggy Bank</h2>
    <h3 style="text-align:center;">Login</h3>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div style="color:red; text-align:center;">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:4px;">
        <input type="password" name="password" placeholder="Password" required style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:4px;">
        <input type="submit" value="🔑 LOGIN" style="width:100%; padding:12px; background:#3498db; color:white; border:none; border-radius:4px; font-size:16px;">
    </form>
    <div style="text-align:center; margin-top:20px; padding:10px; background:white; border-radius:4px;">
        <strong>DEMO:</strong><br>
        Username: <code>admin</code><br>
        Password: <code>admin123</code>
    </div>
</div>
{% endblock %}
