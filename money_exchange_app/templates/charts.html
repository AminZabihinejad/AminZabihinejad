<!DOCTYPE html>
<html lang="en">
<head>
    <title>Balance Charts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial; margin: 10px; text-align: center; }
        canvas { max-width: 100%; height: 400px; }
        .links { margin: 20px; }
        .links a { font-size: 18px; margin: 0 10px; }
    </style>
</head>
<body>
    <h1>📊 Balance Over Time (Last 30 Days)</h1>
    <canvas id="balanceChart"></canvas>
    
    <div class="links">
        <a href="{{ url_for('index') }}">🏠 Dashboard</a> | 
        <a href="{{ url_for('transactions') }}">📋 History</a> | 
        <a href="{{ url_for('export_csv') }}">💾 CSV</a>
    </div>

    <script>
        const ctx = document.getElementById('balanceChart').getContext('2d');
        const data = {{ chart_data | safe }};
        
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.dates,
                datasets: [
                    {
                        label: 'USD Balance',
                        data: data.usd,
                        borderColor: 'red',
                        backgroundColor: 'rgba(255,0,0,0.1)',
                        tension: 0.1
                    },
                    {
                        label: 'EUR Balance', 
                        data: data.eur,
                        borderColor: 'green',
                        backgroundColor: 'rgba(0,255,0,0.1)',
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: false }
                }
            }
        });
    </script>
</body>
</html>
